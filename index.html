<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex — Coding Agent</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .navbar {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 34px;
      border-bottom: 1px solid #eee;
      gap: 30px;
    }

    .brand {
      font-weight: 700;
      font-size: 17px;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      font-size: 12px;
      color: #333;
    }

    .nav-links a {
      color: inherit;
      text-decoration: none;
    }

    .search {
      margin-left: auto;
      font-size: 18px;
      color: #555;
    }

    .hero {
      position: relative;
      max-width: 1180px;
      height: 510px;
      margin: 10px auto 0;
      overflow: hidden;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 25% 20%, rgba(93,112,255,.75), transparent 38%),
        radial-gradient(circle at 80% 35%, rgba(172,155,255,.75), transparent 42%),
        radial-gradient(circle at 60% 85%, rgba(105,126,255,.45), transparent 45%),
        linear-gradient(135deg, #c9d4ff, #eeeaff 50%, #d4d8ff);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -80px;
      background:
        radial-gradient(ellipse at 45% 35%, rgba(255,255,255,.7), transparent 35%),
        radial-gradient(ellipse at 75% 70%, rgba(255,255,255,.35), transparent 30%);
      filter: blur(35px);
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 78px;
      height: 78px;
      margin-bottom: 22px;
      border-radius: 22px;
      background: rgba(255,255,255,.88);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 20px rgba(40,50,130,.16);
    }

    .icon-inner {
      width: 47px;
      height: 47px;
      border-radius: 14px;
      background: linear-gradient(145deg, #655cf5, #a18cff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 68px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: -3px;
    }

    .subtitle {
      margin: 25px 0 29px;
      font-size: 16px;
      color: #222;
    }

    .download {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 20px;
      border-radius: 999px;
      background: #050505;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: transform .15s ease, background .15s ease;
    }

    .download:hover {
      background: #242424;
      transform: translateY(-1px);
    }

    .arrow {
      font-size: 16px;
    }

    @media (max-width: 700px) {
      .navbar { padding: 0 18px; }
      .nav-links { display: none; }
      .hero {
        margin: 8px 10px 0;
        height: 480px;
      }
      h1 {
        font-size: 52px;
      }
      .subtitle {
        max-width: 90%;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <div class="brand">Codex</div>

    <div class="nav-links">
      <a href="#">Research</a>
      <a href="#">Products</a>
      <a href="#">Business</a>
      <a href="#">Developers</a>
      <a href="#">Company</a>
    </div>

    <div class="search">⌕</div>
  </nav>

  <main class="hero">
    <div class="content">

      <div class="icon">
        <div class="icon-inner">&gt;_</div>
      </div>

      <h1>Codex</h1>

      <p class="subtitle">
        A coding agent that helps you build and ship with AI.
      </p>

      <!-- Replace # with your benign challenge download/instructions page. -->
      <a class="download" href="#">
        Download for Windows
        <span class="arrow">↗</span>
      </a>

    </div>
  </main>

</body>
</html>
